name: Temporary Vendor Data Source Probe

# 一次性診斷用（#120／#111，跑完即刪，比照本 repo既有 tmp-* 工作流程
# 慣例）：Vercel MCP 這個 session 的讀回路徑失敗（deploy 成功但
# get_deployment/list_projects/web_fetch_vercel_url 全數 404/403），
# 改用 GitHub Actions runner 的真實網路出口跑既有探測腳本
# （scripts/probe_dividend_sources.py／scripts/probe_iv_history_vendors.py，
# 定義於 claude/implement-tfm9oa 分支，尚未 merge）。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to check out (defaults to claude/implement-tfm9oa where the probe scripts live)"
        required: false
        default: "claude/implement-tfm9oa"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe dividend sources (#120)
        run: python3 scripts/probe_dividend_sources.py
      - name: Probe IV history vendors (#111, public demo key only)
        run: python3 scripts/probe_iv_history_vendors.py
        env:
          ALPHA_VANTAGE_API_KEY: demo
