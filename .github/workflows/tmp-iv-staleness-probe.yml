name: Temporary IV Staleness Diagnostic Probe
on:
  push:
    paths:
      - '.github/workflows/tmp-iv-staleness-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe vendor `updated` timestamps + LEAPS tenor
        env:
          MARKETDATA_APP_TOKEN: ${{ secrets.MARKETDATA_APP_TOKEN }}
        run: |
          PYTHONPATH=. python3 scripts/prototype_iv_staleness_probe.py
