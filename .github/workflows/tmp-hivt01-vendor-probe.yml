name: Temporary HIVT-01 Vendor Probe

# 一次性診斷用（HIVT-01／#152，跑完即刪，比照本 repo 既有 tmp-* 工作流程
# 慣例）：沙箱出口封鎖 api.marketdata.app（CONNECT 403，policy denial，
# 本輪已用 curl 複驗），改用 GitHub Actions runner 的真實網路出口，跑
# scripts/probe_hivt01_single_contract.py。
#
# 比照 tmp-iv-production-probe.yml 的先例，用 push-to-this-path 自觸發，
# workflow 本體跟腳本一起留在 claude/implement-tfm9oa（不需要先進
# master 才能 dispatch）。
#
# 需要 MARKETDATA_APP_TOKEN secret 才能跑完整驗證；若 repo 沒有設定這個
# secret，腳本會誠實回報 credential blocker（exit code 2），不會假裝
# 成功。

on:
  push:
    paths:
      - '.github/workflows/tmp-hivt01-vendor-probe.yml'
      - 'scripts/probe_hivt01_single_contract.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Market Data App single-contract history endpoint (HIVT-01 / #152)
        run: python3 scripts/probe_hivt01_single_contract.py
        env:
          MARKETDATA_APP_TOKEN: ${{ secrets.MARKETDATA_APP_TOKEN }}
