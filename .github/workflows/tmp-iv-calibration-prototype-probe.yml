name: Temporary Historical IV Calibration Prototype Probe
on:
  push:
    paths:
      - '.github/workflows/tmp-iv-calibration-prototype-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run prototype calibration script (retry after vendor 403/rate-limit cooldown)
        env:
          MARKETDATA_APP_TOKEN: ${{ secrets.MARKETDATA_APP_TOKEN }}
        run: |
          PYTHONPATH=. python3 scripts/prototype_historical_iv_calibration.py TLT ORCL
