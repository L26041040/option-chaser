name: Temporary Vendor Data Source Probe (free/no-credential)

# 一次性診斷用（#111，跑完即刪，比照本 repo 既有 tmp-* 工作流程慣例，
# 見 702d13b／6f13f5c 的先例）：補測完全不需要申請金鑰／帳號的候選
# vendor（Yahoo／Nasdaq／Cboe），既有三家（Market Data App／Alpha
# Vantage／ORATS）皆已判定 credential-blocked（研究文件 §5.1 追記）。
#
# 探測腳本定義於 claude/implement-tfm9oa 分支（尚未 merge），這裡只
# checkout 該分支跑腳本，workflow 本體留在 master 只是為了讓
# workflow_dispatch 能被觸發（GitHub 要求 dispatch 用的 workflow 檔案
# 存在於預設分支）。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to check out (defaults to claude/implement-tfm9oa where the probe script lives)"
        required: false
        default: "claude/implement-tfm9oa"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe free/no-credential IV history vendors (#111)
        run: python3 scripts/probe_iv_history_free_vendors.py
