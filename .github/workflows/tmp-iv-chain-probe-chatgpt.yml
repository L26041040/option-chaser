name: Temporary IV Chain Probe (ChatGPT)

on:
  push:
    branches:
      - claude/implement-tfm9oa
    paths:
      - '.github/workflows/tmp-iv-chain-probe-chatgpt.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe deployed APIs without local token
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          bases = [
            ('production','https://option-chaser.vercel.app'),
            ('preview','https://option-chaser-git-claude-imp-aef368-ofriedoriceo-5352s-projects.vercel.app'),
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'option-chaser-diagnostic'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','replace')
                      return r.status, body, dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8','replace'), dict(e.headers)
              except Exception as e:
                  return None, f'{type(e).__name__}: {e}', {}
          for label,base in bases:
              print('\n===== '+label+' =====')
              for path in ['/api/health','/api/settings','/api/scenarios']:
                  st,body,h=get(base+path)
                  print(path,'HTTP',st)
                  print(body[:4000])
              st,body,h=get(base+'/api/scenarios')
              if st!=200: continue
              try: scenarios=json.loads(body)
              except Exception: continue
              for sc in scenarios[:5]:
                  sid=sc.get('id') or sc.get('scenario_id')
                  if not sid: continue
                  st2,b2,_=get(base+f'/api/scenarios/{sid}')
                  print('DETAIL',sid,'HTTP',st2)
                  if st2!=200: continue
                  try: detail=json.loads(b2)
                  except Exception: continue
                  keys=[]
                  def walk(x):
                      if isinstance(x,dict):
                          if isinstance(x.get('candidate_key'),str): keys.append(x['candidate_key'])
                          for v in x.values(): walk(v)
                      elif isinstance(x,list):
                          for v in x: walk(v)
                  walk(detail)
                  uniq=[]
                  for k in keys:
                      if k not in uniq: uniq.append(k)
                  print('candidate_keys_found',len(uniq),uniq[:5])
                  for k in uniq[:3]:
                      from urllib.parse import urlencode
                      st3,b3,_=get(base+f'/api/scenarios/{sid}/iv-history?'+urlencode({'candidate_key':k}))
                      print('IVH',sid,k,'HTTP',st3)
                      print(b3[:3000])
                  if uniq: break
          PY
