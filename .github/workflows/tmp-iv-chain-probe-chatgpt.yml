name: Temporary IV Chain Probe (ChatGPT)

on:
  push:
    branches:
      - claude/implement-tfm9oa
    paths:
      - '.github/workflows/tmp-iv-chain-probe-chatgpt.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/implement-tfm9oa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe recent liquid AAPL historical chain
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
        run: |
          python scripts/probe_production_iv_chain.py --symbol AAPL --date 2026-08-07 --expiration 2026-09-18
      - name: Probe TLT LEAPS historical chain
        if: always()
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
        run: |
          python scripts/probe_production_iv_chain.py --symbol TLT --date 2026-08-07 --expiration 2028-06-16
