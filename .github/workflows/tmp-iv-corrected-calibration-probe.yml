name: Temporary Corrected IV Calibration Probe
on:
  push:
    paths:
      - '.github/workflows/tmp-iv-corrected-calibration-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run corrected calibration (medium/LEAPS, observation-date T/r/q)
        env:
          MARKETDATA_APP_TOKEN: ${{ secrets.MARKETDATA_APP_TOKEN }}
        run: |
          PYTHONPATH=. python3 scripts/prototype_historical_iv_calibration_corrected.py TLT ORCL
