name: Temporary IV Preview Probe

on:
  push:
    paths:
      - '.github/workflows/tmp-iv-production-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_BYPASS_ALT: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Probe protected branch preview
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          base="https://option-chaser-git-claude-imp-aef368-ofriedoriceo-5352s-projects.vercel.app"
          vals=[os.environ.get("VERCEL_BYPASS"),os.environ.get("VERCEL_BYPASS_ALT")]
          bypass=next((v for v in vals if v),None)
          token=os.environ.get("VERCEL_TOKEN")
          print("bypass_secret_present=", bool(bypass))
          print("vercel_token_present=", bool(token))

          def get(path):
              headers={"Accept":"application/json","User-Agent":"option-chaser-gh-probe"}
              if bypass: headers["x-vercel-protection-bypass"]=bypass
              if token: headers["Authorization"]="Bearer "+token
              req=urllib.request.Request(base+path,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8","replace")
              except Exception as e:
                  return 0,f"{type(e).__name__}: {e}"

          st,body=get('/api/health'); print('HEALTH',st,body[:1200])
          st,body=get('/api/scenarios'); print('SCENARIOS',st,body[:2500])
          if st!=200: raise SystemExit(0)
          try: scenarios=json.loads(body)
          except Exception: scenarios=[]
          def keys(x,out):
              if isinstance(x,dict):
                  k=x.get('candidate_key')
                  if isinstance(k,str) and k and k not in out: out.append(k)
                  for v in x.values(): keys(v,out)
              elif isinstance(x,list):
                  for v in x: keys(v,out)
          for sc in scenarios[:10]:
              sid=sc.get('id')
              if not sid: continue
              st2,b2=get('/api/scenarios/'+urllib.parse.quote(str(sid)))
              print('DETAIL',sid,st2)
              if st2!=200: print(b2[:1000]); continue
              try: d=json.loads(b2)
              except Exception: continue
              ks=[]; keys(d,ks)
              print('candidate_count',len(ks),'sample',ks[:3])
              for k in ks[:3]:
                  q=urllib.parse.urlencode({'candidate_key':k})
                  st3,b3=get('/api/scenarios/'+urllib.parse.quote(str(sid))+'/iv-history?'+q)
                  print('IV_HISTORY',sid,k,'HTTP',st3)
                  print(b3[:7000])
              if ks: break
          PY
