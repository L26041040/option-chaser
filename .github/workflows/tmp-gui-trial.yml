name: Temporary GUI Trial

on:
  pull_request:
    branches:
      - tmp-gui-base-20260719

jobs:
  gui-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audited GUI commit
        uses: actions/checkout@v4
        with:
          ref: e0286d2a7e71cd7c19bc6f08167a42b06a70780c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install application and browser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" playwright
          python -m playwright install --with-deps chromium

      - name: Launch Streamlit
        shell: bash
        run: |
          mkdir -p gui-artifacts
          streamlit run webapp/app.py \
            --server.headless true \
            --server.address 0.0.0.0 \
            --server.port 8501 \
            > gui-artifacts/streamlit.log 2>&1 &
          echo $! > gui-artifacts/streamlit.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          cat gui-artifacts/streamlit.log
          exit 1

      - name: Trial GUI with Chromium
        shell: bash
        run: |
          cat > /tmp/gui_trial.py <<'PY'
          from pathlib import Path
          import json
          import traceback
          from playwright.sync_api import sync_playwright

          OUT = Path("gui-artifacts")
          OUT.mkdir(exist_ok=True)
          console_logs = []
          summary = {}

          def snap(page, name):
              page.screenshot(path=str(OUT / name))

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page(
                      viewport={"width": 1440, "height": 1000},
                      locale="zh-TW",
                  )
                  page.on("console", lambda msg: console_logs.append(f"{msg.type}: {msg.text}"))
                  page.on("pageerror", lambda exc: console_logs.append(f"pageerror: {exc}"))

                  page.goto("http://127.0.0.1:8501", wait_until="networkidle", timeout=120_000)
                  page.get_by_text("Option Chaser", exact=True).wait_for(timeout=30_000)
                  snap(page, "01-home-desktop.png")

                  plain_inputs = page.locator('input:not([type="checkbox"])')
                  input_info = []
                  for i in range(plain_inputs.count()):
                      node = plain_inputs.nth(i)
                      input_info.append({
                          "index": i,
                          "type": node.get_attribute("type"),
                          "value": node.input_value(),
                          "placeholder": node.get_attribute("placeholder"),
                          "aria_label": node.get_attribute("aria-label"),
                      })
                  summary["inputs"] = input_info
                  if plain_inputs.count() < 3:
                      raise AssertionError(f"Expected at least 3 form inputs, got {plain_inputs.count()}")

                  plain_inputs.nth(0).fill("TLT")
                  plain_inputs.nth(1).fill("105")
                  plain_inputs.nth(2).fill("2028/01/01")
                  plain_inputs.nth(2).press("Enter")
                  plain_inputs.nth(2).press("Tab")

                  defaults = {
                      "Long Call": True,
                      "Bull Call Spread": True,
                      "Long Put": False,
                      "Bear Put Spread": False,
                  }
                  for label, desired in defaults.items():
                      checkbox = page.get_by_label(label, exact=True)
                      if checkbox.is_checked() != desired:
                          checkbox.set_checked(desired)

                  snap(page, "02-form-filled-desktop.png")
                  page.get_by_role("button", name="開始分析").click()

                  page.get_by_text("跨策略比較", exact=True).wait_for(timeout=300_000)
                  page.get_by_text("劇本摘要", exact=True).wait_for(timeout=30_000)
                  snap(page, "03-results-top-desktop.png")

                  body_text = page.locator("body").inner_text()
                  (OUT / "visible-text.txt").write_text(body_text, encoding="utf-8")
                  required = [
                      "TLT 現價", "2028-01-01 前到達 105.00",
                      "跨策略比較", "最高報酬", "Long Call",
                      "Bull Call Spread", "查看 Heatmap", "現價", "目標", "到期",
                  ]
                  missing = [item for item in required if item not in body_text]
                  if missing:
                      raise AssertionError(f"Missing visible UI text: {missing}")

                  tables = page.locator("table")
                  summary["desktop_table_count"] = tables.count()
                  summary["body_scroll_width_desktop"] = page.evaluate("document.body.scrollWidth")
                  summary["viewport_width_desktop"] = page.evaluate("window.innerWidth")

                  # Comparison table and the first visible Long Call heatmap.
                  if tables.count() >= 1:
                      tables.nth(0).screenshot(path=str(OUT / "04-comparison-table-desktop.png"))
                  long_heatmap = page.locator('div[style*="overflow-x:auto"]').first
                  long_heatmap.scroll_into_view_if_needed()
                  page.wait_for_timeout(500)
                  snap(page, "05-long-call-heatmap-desktop.png")
                  long_heatmap.screenshot(path=str(OUT / "06-long-call-heatmap-element.png"))

                  # Switch to Bull Call Spread tab and capture its first candidate + heatmap.
                  spread_tab = page.get_by_role("tab", name="Bull Call Spread", exact=True)
                  spread_tab.click()
                  page.wait_for_timeout(800)
                  page.get_by_text("買 93 / 賣 100", exact=False).first.wait_for(timeout=30_000)
                  spread_heatmaps = page.locator('div[style*="overflow-x:auto"]')
                  summary["heatmap_containers_after_spread_tab"] = spread_heatmaps.count()
                  visible_spread_heatmap = None
                  for i in range(spread_heatmaps.count()):
                      candidate = spread_heatmaps.nth(i)
                      if candidate.is_visible():
                          visible_spread_heatmap = candidate
                          break
                  if visible_spread_heatmap is None:
                      raise AssertionError("No visible Bull Call Spread heatmap")
                  visible_spread_heatmap.scroll_into_view_if_needed()
                  page.wait_for_timeout(500)
                  snap(page, "07-bull-call-spread-heatmap-desktop.png")
                  visible_spread_heatmap.screenshot(path=str(OUT / "08-bull-call-spread-heatmap-element.png"))

                  # Mobile trial: preserve session/result, resize, and check document-level overflow.
                  page.set_viewport_size({"width": 390, "height": 844})
                  page.evaluate("window.scrollTo(0, 0)")
                  page.wait_for_timeout(1000)
                  snap(page, "09-results-top-mobile.png")
                  summary["body_scroll_width_mobile"] = page.evaluate("document.body.scrollWidth")
                  summary["viewport_width_mobile"] = page.evaluate("window.innerWidth")
                  summary["mobile_document_overflow"] = (
                      summary["body_scroll_width_mobile"] > summary["viewport_width_mobile"] + 2)

                  visible_spread_heatmap.scroll_into_view_if_needed()
                  page.wait_for_timeout(500)
                  snap(page, "10-spread-heatmap-mobile.png")
                  visible_spread_heatmap.screenshot(path=str(OUT / "11-spread-heatmap-mobile-element.png"))

                  summary["horizontal_heatmap_containers"] = page.locator(
                      'div[style*="overflow-x:auto"]').count()
                  if summary["horizontal_heatmap_containers"] < 1:
                      raise AssertionError("Expected a horizontally scrollable heatmap container")

                  browser.close()

              summary["status"] = "PASS"
          except Exception:
              summary["status"] = "FAIL"
              summary["traceback"] = traceback.format_exc()
              (OUT / "failure-traceback.txt").write_text(summary["traceback"], encoding="utf-8")
              raise
          finally:
              (OUT / "console.log").write_text("\n".join(console_logs), encoding="utf-8")
              (OUT / "summary.json").write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python /tmp/gui_trial.py

      - name: Upload GUI trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-chaser-gui-trial
          path: gui-artifacts/
          if-no-files-found: error
