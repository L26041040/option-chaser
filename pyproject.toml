[project]
name = "option-chaser"
version = "0.1.0"
description = "Long Call scenario optimizer (deterministic, no probability logic)"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2",
  "tzdata; platform_system == 'Windows'",
]

[project.scripts]
option-chaser = "option_chaser.cli:main"

[project.optional-dependencies]
gui = ["streamlit>=1.30"]
# 新前端輪（V1／#48）：HTTP API 是後端唯一測試接縫，其契約測試必須跑得起來
# ——不裝就會被靜默跳過、CI 綠燈失去意義。與 requirements.txt（Vercel 執行期）
# 保持同步。
api = ["fastapi>=0.117.1", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["option_chaser*"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.vercel]
# V1（#48）部署踩坑：Vercel 的 Python 進入點自動偵測是靜態掃描找
# `app = ...` 這種賦值寫法，認不出 `api/index.py` 的
# `from api_app.main import app`（匯入再轉出）。明確指定進入點繞過
# 自動偵測，指向 FastAPI app 物件實際定義的位置。
entrypoint = "api_app.main:app"
