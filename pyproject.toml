[project]
name = "option-chaser"
version = "0.1.0"
description = "Long Call scenario optimizer (deterministic, no probability logic)"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2",
  "tzdata; platform_system == 'Windows'",
]

[project.scripts]
option-chaser = "option_chaser.cli:main"

[project.optional-dependencies]
gui = ["streamlit>=1.30"]
# 新前端輪（V1／#48）：HTTP API 是後端唯一測試接縫，其契約測試必須跑得起來
# ——不裝就會被靜默跳過、CI 綠燈失去意義。與 requirements.txt（Vercel 執行期）
# 保持同步。
api = ["fastapi>=0.117.1", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["option_chaser*"]

[tool.pytest.ini_options]
addopts = "-q"

# 注意：這裡刻意**沒有** `[tool.vercel]`。加上它會讓 Vercel 把整個專案
# 判定為「Python 後端框架」，於是只跑 pyproject 的依賴安裝、完全不跑
# 前端的 npm/vite build（實測 build log 證實），函式也因為 pyproject
# 沒有 fastapi 而啟動即崩。本專案是「Vite 前端＋api/ 底下的 Python
# 函式」，模式由 vercel.json 的 `framework: vite` 指定。
