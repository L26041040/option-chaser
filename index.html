<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Seed Warm（SW-01／#331）：淺色唯一，不再需要深/淺兩份
         theme-color。 -->
    <meta name="theme-color" content="#FBF7F0" />
    <title>Option Chaser</title>
    <!-- SW-01（#331）：Plus Jakarta Sans（拉丁／數字）× Noto Sans TC
         （繁中）皆為真正 web font，不依賴使用者系統字型 fallback（那
         正是「新細明體」問題的根因）。preconnect 兩個 Google Fonts
         網域省掉一次 DNS+TLS 往返，`display=swap` 讓文字先用 fallback
         字體顯示、字型到位後才換上，不會讓使用者等一片空白。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
